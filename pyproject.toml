# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cardvision"
version = "0.9.0rc2"
description = "Card detection and recognition for trading-card game video."
readme = "README.md"
license = "Apache-2.0"
# NOTICE refers the reader to PROVENANCE.md and TRADEMARK.md, so both travel with it.
license-files = ["LICENSE", "LICENSE-DATA", "NOTICE", "PROVENANCE.md", "TRADEMARK.md"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Everything the tests use that needs no PyTorch. onnx builds tiny throwaway models at run
# time, OpenCV (the package of the "video" extra) reads and writes the short videos of the
# video tests, and jsonschema checks the manifest's JSON Schema against the validator. With
# this extra alone, the tests that need the "train" extra are skipped. The check that the
# package and the browser runtime agree is skipped too, unless npm ci has been run in
# browser/; the browser workflow runs that check and requires it.
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "onnx>=1.15",
    "opencv-python-headless>=4.8",
    "jsonschema>=4.0",
]
# Reading video files (cardvision infer on a video).
video = [
    "opencv-python-headless>=4.8",
]
# The optional geometric stage (cardvision build-features, and --geometric on infer and
# evaluate): local features, matching and RANSAC, all from OpenCV.
geometric = [
    "opencv-python-headless>=4.8",
]
# Downloading a manifest's videos (cardvision fetch --download). Optional even for fetch, which
# also reads video files you already have; reading any video needs the "video" extra as well.
# certifi is a bundle of CA certificates: some Python builds ship none (the macOS installer from
# python.org is one), and every https request then fails. The downloader and the other commands
# that download (fetch-textures, train-detector --download-pretrained) use it when it is installed.
download = [
    "yt-dlp>=2024.4.9",
    "certifi>=2024.2.2",
]
# Publishing to a product's own Cloudflare R2 bucket (cardvision cdn publish, publish-geo,
# publish-release). plan --offline and the verify commands need nothing beyond the standard library.
cdn = [
    "boto3>=1.34",
]
# Exporting checkpoints (cardvision export). The detector's network is built by the YOLOX
# package, which is installed separately after these: its metadata pins library versions that
# conflict with the ones above, and its build needs PyTorch already present. loguru, tabulate,
# psutil, torchvision and OpenCV are what YOLOX imports. The command is printed by
# "cardvision export detector" when YOLOX is missing.
# Training the detector (cardvision train-detector) also uses YOLOX's data modules, which
# import pycocotools and tqdm, and reads its config with tomli where Python has no tomllib.
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "safetensors>=0.4",
    "onnx>=1.15",
    "opencv-python-headless>=4.8",
    "loguru>=0.7",
    "tabulate>=0.9",
    "psutil>=5.9",
    "pycocotools>=2.0",
    "tqdm>=4.60",
    # The trainers read TOML configs; Python 3.11 and later have a reader built in.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
cardvision = "cardvision.cli:main"

[tool.setuptools.packages.find]
include = ["cardvision*"]

# The files inside the package that are not Python: the list of CC0 background scans that
# "cardvision fetch-textures" takes, each trainer's defaults written out as a config to copy, and
# the schema of a refresh rule's PARAMETERS line that "cardvision refresh verdict" checks.
[tool.setuptools.package-data]
"cardvision.composites" = ["cc0_textures.json"]
"cardvision.refresh" = ["rule_schema.json"]
"cardvision.train_detector" = ["default.toml"]
"cardvision.train_recognizer" = ["default.toml"]

[tool.pytest.ini_options]
# The labeling tool is a separate standard-library program with a unittest suite of its own
# ("python -m unittest discover -s labeler"); pytest runs that suite too.
testpaths = ["tests", "labeler"]
addopts = "-ra"
