# SPDX-License-Identifier: Apache-2.0
#
# Builds the package and uploads it to the Python package index. No password or token is
# stored anywhere: the index trusts this workflow file in this repository ("trusted
# publishing"), and each upload job runs in a named environment the maintainer can protect.
#
# It runs only by dispatch, by hand (Actions, Publish, Run workflow) or started by release.yml;
# publishing a release on GitHub uploads nothing. Publishing to the index is set up: the index
# trusts this workflow, the environment `pypi` needs a required reviewer's approval and takes
# only `v*` tags, and the package is on the index as `cardvision` from 0.4.0.
#
# - Target `testpypi` (the default) uploads to the index's test site, from the environment
#   `testpypi`, as a rehearsal. Nothing reaches the real index that way.
# - Target `pypi` uploads to the package index, from the environment `pypi`. Run it on the
#   release's tag, which must be `v` followed by the version in pyproject.toml.
name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload: testpypi (a rehearsal) or pypi"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the source archive and the wheel
        run: |
          python -m pip install --require-hashes -r requirements-publish.txt
          python -m build
          python -m twine check --strict dist/*
      - name: The tag must match the package version
        if: inputs.target == 'pypi'
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag is ${GITHUB_REF_NAME}, but pyproject.toml says version ${version}." >&2
            exit 1
          fi
      - name: The wheel installs and lists its commands
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install dist/*.whl
          /tmp/check/bin/cardvision
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Upload to the test site (rehearsal)
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload to the package index
    if: inputs.target == 'pypi' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  installed:
    name: The uploaded version installs from the index
    if: inputs.target == 'pypi' && github.ref_type == 'tag'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the version from the index in a fresh environment and print it
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/fresh
          for attempt in 1 2 3 4 5; do
            if /tmp/fresh/bin/python -m pip install --no-cache-dir "cardvision==${version}"; then
              /tmp/fresh/bin/python -c "import cardvision; print(cardvision.__version__)"
              exit 0
            fi
            echo "Attempt ${attempt} of 5 failed; the index may not list ${version} yet." >&2
            sleep 60
          done
          echo "cardvision ${version} did not install from the index after 5 tries." >&2
          exit 1
