# SPDX-License-Identifier: Apache-2.0
#
# The downstream canary: does a change to the browser runtime still work in the products that
# vendor it? For each product named in the repository variable CANARY_TARGETS, it builds this
# checkout, checks the product out at its branch's current commit, vendors the new build into it with the
# options the product's own manifest records, and runs the product's own checks (its steps, in
# the variable). OpenCV.js, which takes long to build from source, is borrowed from the product's
# own vendored folder; the vendor step checks it against opencv.lock.json. The product's install
# scripts and tests do run here, with no secret to read; nothing is pushed anywhere.
#
# It is not a required check, but red still means do not merge: fix the change, or merge a change
# in the product that works with both toolkits first (RELEASING.md, "What a red check means").
# What a pull request cannot fix is a warning: a product that cannot be read, or one whose checks
# also fail without the new build.
#
# CANARY_TARGETS is a JSON list of { repo, branch | sha, vendorDir, steps, chrome? }: see
# browser/scripts/canary.mjs, and RELEASING.md ("The downstream canary") for how to set it. The
# workflow names no product. An empty variable, as on a fork, is a neutral skip, shown in the job
# summary.
#
# A run that ends green saves a marker in the Actions cache, keyed by a hash of browser/**,
# docs/hover-spec.*, this workflow and the targets at the commits they resolve to. A later run with the same key (a re-run, or a version pull
# request that changes none of them) finds the marker, skips the builds and cites the earlier run.
#
# Safety: the pull request event only, with its own power; contents: read; no secrets;
# checkouts keep no credentials. The commands in the variable are the maintainer's, and run with no secret to read.
name: Downstream canary

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run == 'true' && steps.marker.outputs.skip != 'true' }}
      matrix: ${{ steps.plan.outputs.matrix }}
      key: ${{ steps.plan.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the list of products
        id: plan
        env:
          CANARY_TARGETS: ${{ vars.CANARY_TARGETS }}
        run: node browser/scripts/canary.mjs plan .
      - name: Look for an earlier passing run of the same inputs
        id: restore
        if: steps.plan.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: canary-marker
          key: canary-ok-${{ steps.plan.outputs.key }}
      - name: Skip when the marker is found
        id: marker
        if: steps.plan.outputs.run == 'true' && steps.restore.outputs.cache-hit == 'true'
        run: node browser/scripts/canary.mjs marker-note canary-marker/note.txt

  targets:
    name: ${{ matrix.repo }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Borrow the product's OpenCV.js (it is not in the repository and takes long to build)
        env:
          VENDOR_DIR: ${{ matrix.vendorDir }}
        run: node toolkit/browser/scripts/canary.mjs seed-opencv toolkit product "$VENDOR_DIR"
      - name: Build the toolkit's browser runtime at this checkout
        working-directory: toolkit/browser
        run: |
          npm ci
          npm run build
      - name: Install the product's locked dependencies
        working-directory: product
        run: npm ci
      - name: Vendor the new build into the product, with the options its manifest records
        env:
          VENDOR_DIR: ${{ matrix.vendorDir }}
        run: node toolkit/browser/scripts/canary.mjs vendor toolkit product "$VENDOR_DIR"
      - name: Install Chrome for Testing, puppeteer-core and ffmpeg
        if: matrix.chrome
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/pcore" puppeteer-core@25.17.0
          # Pinned, so a new Chrome release never changes a run on its own.
          npx --yes @puppeteer/browsers@3.2.7 install chrome@157.0.8103.78 --path "$RUNNER_TEMP/cft" | tee "$RUNNER_TEMP/cft.txt"
          echo "CHROME=$(tail -n1 "$RUNNER_TEMP/cft.txt" | cut -d' ' -f2-)" >> "$GITHUB_ENV"
          echo "PUPPETEER_CORE_DIR=$RUNNER_TEMP/pcore" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the product's own checks
        id: checks
        env:
          STEPS: ${{ toJSON(matrix.steps) }}
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_SHA: ${{ matrix.sha }}
        run: node toolkit/browser/scripts/canary.mjs run product
      - name: Report a failure before the checks began
        if: failure() && steps.checks.outcome == 'skipped'
        env:
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          printf '### %s at %s: failed before the product checks ran (see the log)\n' "$TARGET_REPO" "${TARGET_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"

  record:
    name: Record the pass
    needs: [plan, targets]
    if: needs.plan.outputs.run == 'true' && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the marker
        env:
          NOTE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }})
        run: |
          mkdir canary-marker
          printf '%s\n' "$NOTE" > canary-marker/note.txt
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: canary-marker
          key: canary-ok-${{ needs.plan.outputs.key }}
