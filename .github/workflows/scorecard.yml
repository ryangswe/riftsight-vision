# SPDX-License-Identifier: Apache-2.0
#
# OpenSSF Scorecard (https://scorecard.dev): an automated check of the repository's security
# practices, such as pinned workflow steps, branch protection, token permissions and dependency
# updates. It runs weekly, on a push to main and when branch protection changes. Its findings go to
# the repository's code scanning alerts, and its score to the public Scorecard API, which the
# README's badge reads. It reads the repository and writes nothing to it.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'ryangswe/riftsight-vision'
    runs-on: ubuntu-latest
    permissions:
      # The findings, to code scanning.
      security-events: write
      # Publishing the score: Scorecard checks the run's identity token.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
