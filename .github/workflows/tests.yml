# SPDX-License-Identifier: Apache-2.0
#
# The tests, in the environment requirements-lock.txt pins, on the oldest supported Python
# and a newer one. In this environment the tests that need PyTorch are skipped. The check that
# the Python package and the browser runtime agree is skipped here too, because npm ci is not
# run in browser/; browser.yml runs that check and requires it. Some tests need the ffmpeg
# program: one test of tests/test_data_extract.py, and the tests of
# tests/test_data_frame_times.py that read a recording of variable frame rate. This workflow
# installs ffmpeg and ffprobe so that they run; on a machine that has none they are skipped.
# They come from a static build of ffmpeg 7.0.2, published as fixed GitHub release assets and
# each checked against its SHA-256, not from Ubuntu's package servers, so that an outage there
# does not stop the tests. The install stops after 5 minutes,
# so that a download that cannot finish fails the job quickly. The tests run
# on every core of the runner (pytest-xdist), one test file per worker at a time, so that the
# setup a file shares between its tests runs once.
# The 20 slowest test phases are listed at the end, so that their times on the runner can be seen.
#
# Each Python version runs in three parts, on three runners at the same time: `--shard 1/3`,
# `--shard 2/3` and `--shard 3/3` (tests/shards.py). The parts split the test files between
# them, so that together they run every test once. Each part runs its longest files first, so
# that its last files are short and the workers finish together; --no-loadscope-reorder keeps
# that order, which pytest-xdist would otherwise change to the number of tests per file. The
# job named after the version, "Python 3.11" and so on, passes only when all of its parts
# passed; those are the names the checks of a pull request go by. The steps are written once, under the
# first version, and the other versions repeat them (`steps: *steps`).
#
# Each part keeps its JUnit report for a week. On a push to main, a last job compares the
# parts' times, the median over that run and the four before it on main, with
# tests/shard_seconds.json and opens, updates or closes the issue "Test parts are out of
# balance" (tests/shards.py says when); it is the only job that may write issues.
#
# After the tests, the first part of each version also runs the lint, with ruff at the version requirements-lint.txt pins
# and the bug-finding rules in pyproject.toml.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests-3-11:
    name: Python ${{ matrix.python }}, part ${{ matrix.part }} of 3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        part: [1, 2, 3]
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        timeout-minutes: 5
        env:
          FFMPEG_RELEASE: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          cd "$RUNNER_TEMP/ffmpeg"
          for program in ffmpeg ffprobe; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "$program.gz" "$FFMPEG_RELEASE/$program-linux-x64.gz"
          done
          sha256sum --check --strict - <<'SUMS'
          bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz
          25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz
          SUMS
          gunzip ffmpeg.gz ffprobe.gz
          chmod +x ffmpeg ffprobe
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          ./ffmpeg -version | sed -n 1p
          ./ffprobe -version | sed -n 1p
      - name: Install the base lock
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Run the tests
        run: python -m pytest -n auto --dist loadfile --no-loadscope-reorder --durations=20 --junitxml=junit.xml --shard ${{ matrix.part }}/3
      - name: Keep the test times for the balance check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.python }}-part-${{ matrix.part }}
          path: junit.xml
          retention-days: 7
      - name: Install the pinned lint
        if: matrix.part == 1
        run: python -m pip install --require-hashes -r requirements-lint.txt
      - name: Lint for bug patterns
        if: matrix.part == 1
        run: python -m ruff check .

  tests-3-12:
    name: Python ${{ matrix.python }}, part ${{ matrix.part }} of 3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        part: [1, 2, 3]
    steps: *steps

  tests-3-13:
    name: Python ${{ matrix.python }}, part ${{ matrix.part }} of 3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
        part: [1, 2, 3]
    steps: *steps

  tests-3-14:
    name: Python ${{ matrix.python }}, part ${{ matrix.part }} of 3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
        part: [1, 2, 3]
    steps: *steps

  python-3-11:
    name: Python 3.11
    needs: tests-3-11
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          PARTS: ${{ needs.tests-3-11.result }}
        run: test "$PARTS" = success

  python-3-12:
    name: Python 3.12
    needs: tests-3-12
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          PARTS: ${{ needs.tests-3-12.result }}
        run: test "$PARTS" = success

  python-3-13:
    name: Python 3.13
    needs: tests-3-13
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          PARTS: ${{ needs.tests-3-13.result }}
        run: test "$PARTS" = success

  python-3-14:
    name: Python 3.14
    needs: tests-3-14
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          PARTS: ${{ needs.tests-3-14.result }}
        run: test "$PARTS" = success

  balance:
    name: Test parts balance
    needs: [tests-3-11, tests-3-12, tests-3-13, tests-3-14]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
      # One run's times vary too much to judge by, so the check takes the median over this run and
      # the four before it on main. Reports are kept for a week; a run without them is skipped.
      - name: Download the reports of the four runs on main before this one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch main --event push \
                   --status success --limit 4 --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'junit-*' --dir "earlier/$run" \
              || echo "Run $run has no test reports left."
          done
      - name: Compare the parts' times with the recorded seconds
        id: compare
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python tests/shards.py check junit --earlier earlier --parts 3 --run-url "$RUN_URL" --body balance.md
          >> "$GITHUB_OUTPUT"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.compare.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title=$(python -c 'import sys; sys.path.insert(0, "tests"); import shards; print(shards.ISSUE_TITLE)')
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                     --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          case "$STATE" in
            open)
              if [ -n "$number" ]; then gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file balance.md
              else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file balance.md; fi ;;
            keep)
              if [ -n "$number" ]; then gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file balance.md; fi ;;
            close)
              if [ -n "$number" ]; then
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The parts are balanced again: $RUN_URL"
              fi ;;
            *)
              echo "unknown state: $STATE"; exit 1 ;;
          esac
          echo "Balance: $STATE" >> "$GITHUB_STEP_SUMMARY"
          cat balance.md >> "$GITHUB_STEP_SUMMARY"
