# SPDX-License-Identifier: Apache-2.0
#
# The tests, in the environment requirements-lock.txt pins, on the oldest supported Python
# and a newer one. In this environment the tests that need PyTorch are skipped. The check that
# the Python package and the browser runtime agree is skipped here too, because npm ci is not
# run in browser/; browser.yml runs that check and requires it. Some tests need the ffmpeg
# program: one test of tests/test_data_extract.py, and the tests of
# tests/test_data_frame_times.py that read a recording of variable frame rate. This workflow
# installs ffmpeg and ffprobe so that they run; on a machine that has none they are skipped.
# They come from a static build of ffmpeg 7.0.2, published as fixed GitHub release assets and
# each checked against its SHA-256, not from Ubuntu's package servers, so that an outage there
# does not stop the tests. The install stops after 5 minutes,
# so that a download that cannot finish fails the job quickly. The tests run
# on every core of the runner (pytest-xdist), one test file per worker at a time, so that the
# setup a file shares between its tests runs once.
#
# After the tests, each job also runs the lint, with ruff at the version requirements-lint.txt pins
# and the bug-finding rules in pyproject.toml.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        timeout-minutes: 5
        env:
          FFMPEG_RELEASE: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          cd "$RUNNER_TEMP/ffmpeg"
          for program in ffmpeg ffprobe; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "$program.gz" "$FFMPEG_RELEASE/$program-linux-x64.gz"
          done
          sha256sum --check --strict - <<'SUMS'
          bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz
          25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz
          SUMS
          gunzip ffmpeg.gz ffprobe.gz
          chmod +x ffmpeg ffprobe
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          ./ffmpeg -version | sed -n 1p
          ./ffprobe -version | sed -n 1p
      - name: Install the base lock
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Run the tests
        run: python -m pytest -n auto --dist loadfile
      - name: Install the pinned lint
        run: python -m pip install --require-hashes -r requirements-lint.txt
      - name: Lint for bug patterns
        run: python -m ruff check .
