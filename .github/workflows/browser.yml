# SPDX-License-Identifier: Apache-2.0
#
# The browser runtime under browser/: its own tests, its build, and the check that it and the
# Python package give the same answers on the toy game (tests/test_browser_agreement.py), with
# the fixtures both sides are pinned to (tests/test_browser_fixtures.py). No browser is started:
# the TypeScript pipeline runs under Node, on ONNX Runtime Web's WebAssembly backend.
# Before the tests, the type-aware lint (npm run lint, browser/.oxlintrc.json) runs.
#
# The second job, "Host browser test", loads the toy fixture extension (browser/fixture-extension/,
# built against the built host files) unpacked in headless Chrome for Testing, on a local page that
# plays a clip, and runs the hover browser test (browser/harness/) on it, then the rollback check
# (build A, then build B on the same profile). Recognition is simulated by the toy release's
# stand-in models; nothing is fetched and no card art is used. Chrome needs one kernel setting on
# Ubuntu 24.04: AppArmor otherwise blocks the user namespaces of its sandbox ("No usable sandbox").
# ffmpeg is the pinned static build tests.yml installs, not Ubuntu's package, because a slow package
# server can hold the job for many minutes.
name: Browser runtime

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    name: Tests, build and agreement with Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the browser runtime's locked dependencies
        working-directory: browser
        run: npm ci
      - name: Lint for unhandled promises and missed switch cases
        working-directory: browser
        run: npm run lint
      - name: Type-check and run the browser runtime's tests
        working-directory: browser
        run: npm test
      - name: Build
        working-directory: browser
        run: npm run build
      - name: Run the tests that need the build (dist/)
        working-directory: browser
        env:
          CARDVISION_REQUIRE_BROWSER: "1"
        run: npx vitest run test/verify-release.test.ts test/package-zip.test.ts test/bundle-purity.test.ts test/host-types-consumer.test.ts test/realm-marks.test.ts
      - name: Install the Python package's base lock
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Check that the browser runtime and the Python package agree
        env:
          CARDVISION_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_browser_fixtures.py tests/test_browser_agreement.py tests/test_cdn_node_integration.py -ra

  host-browser:
    name: Host browser test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the browser runtime's locked dependencies and build it
        working-directory: browser
        run: |
          npm ci
          npm run build
      - name: Write the toy release and the toy game's card pictures
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python tests/test_browser_fixtures.py --demo "$RUNNER_TEMP/toy"
      - name: Type-check the fixture against the built host files, and build it twice
        id: fixture-build
        working-directory: browser
        run: |
          npx tsc --noEmit -p fixture-extension
          node scripts/build-fixture.mjs --release-dir "$RUNNER_TEMP/toy/release" --art-dir "$RUNNER_TEMP/toy/art" --out "$RUNNER_TEMP/fixture-main" --version 0.0.1
          node scripts/build-fixture.mjs --release-dir "$RUNNER_TEMP/toy/release" --art-dir "$RUNNER_TEMP/toy/art" --idle-unload-ms 6000 --version 0.0.2 --out "$RUNNER_TEMP/fixture-idle"
      - name: Install ffmpeg
        timeout-minutes: 5
        env:
          FFMPEG_RELEASE: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          cd "$RUNNER_TEMP/ffmpeg"
          for program in ffmpeg ffprobe; do
            curl --fail --silent --show-error --location --connect-timeout 20 --max-time 120 --retry 3 \
              --output "$program.gz" "$FFMPEG_RELEASE/$program-linux-x64.gz"
          done
          sha256sum --check --strict - <<'SUMS'
          bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz
          25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz
          SUMS
          gunzip ffmpeg.gz ffprobe.gz
          chmod +x ffmpeg ffprobe
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          ./ffmpeg -version | sed -n 1p
          ./ffprobe -version | sed -n 1p
      - name: Install Chrome for Testing and puppeteer-core
        id: chrome-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/pcore" puppeteer-core@25.17.0
          # Pinned, so a new Chrome release never changes a run on its own: move both pins together.
          npx --yes @puppeteer/browsers@3.2.7 install chrome@157.0.8103.78 --path "$RUNNER_TEMP/cft" | tee "$RUNNER_TEMP/cft.txt"
          echo "CHROME=$(tail -n1 "$RUNNER_TEMP/cft.txt" | cut -d' ' -f2-)" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the hover browser test on the fixture
        working-directory: browser
        env:
          PUPPETEER_CORE_DIR: ${{ runner.temp }}/pcore
        run: |
          node harness/hover-browser.mjs --product fixture-extension/product.mjs --chrome "$CHROME" \
            --release "$RUNNER_TEMP/toy/release" --art "$RUNNER_TEMP/toy/art" \
            --dist "$RUNNER_TEMP/fixture-main" --dist-idle "$RUNNER_TEMP/fixture-idle" --out "$RUNNER_TEMP/host-browser"
      - name: Run the rollback check (the main build, then the idle build, on one profile)
        # Also after a failed hover test, but never without the two builds and Chrome.
        if: ${{ !cancelled() && steps.fixture-build.outcome == 'success' && steps.chrome-install.outcome == 'success' }}
        working-directory: browser
        env:
          PUPPETEER_CORE_DIR: ${{ runner.temp }}/pcore
        run: |
          node harness/rollback-check.mjs --product fixture-extension/product.mjs --chrome "$CHROME" \
            --release "$RUNNER_TEMP/toy/release" --art "$RUNNER_TEMP/toy/art" \
            --a "$RUNNER_TEMP/fixture-main" --b "$RUNNER_TEMP/fixture-idle" --out "$RUNNER_TEMP/host-browser/rollback"
      - name: Keep the reports, the event log and the NetLogs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-browser
          path: ${{ runner.temp }}/host-browser
          if-no-files-found: warn
